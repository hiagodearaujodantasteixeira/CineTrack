<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel=stylesheet href="style.css" >
    <title>CineTrack</title>
</head>
<body>
    <header> 
        <h1>CineTrack</h1>
        <input type="search" aria-label="Buscar filme">
        <a href="adicionar.html"><button>+ Adicionar</button></a>
    </header>

    <nav aria-label="Filtros de status">
        <button class="ativo">Todos</button>
        <button>Assistido</button>
        <button>Assistindo</button>
        <button>Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite">
            <article class="card">
                <img src="https://image.tmdb.org/t/p/w200/A7nssMRIPauZhEVf2dzwsf4EALO.jpg" 
                    alt="Poster de Carros">
                    <h2>Carros</h2>
                    <p>2010 | Animação</p>
                    <p>Nota: ★★★★★</p>
                    <span>Assistido </span>
                    <div class="acoes">
                        <button>Editar</button><button>Remover</button>
                    </div>
            </article>
            <article class="card">
                <img src="https://image.tmdb.org/t/p/w200/itmAEE92LNrIdsU5LEHoyksVaY.jpg" 
                    alt="Poster de Batman: O Cavaleiro das Trevas">
                    <h2>Batman: O Cavaleiro das Trevas</h2>
                    <p>2008 | Ação</p>
                    <p>Nota: ★★★★★</p>
                    <span>Assistido </span>
                    <div class="acoes">
                        <button>Editar</button><button>Remover</button>
                    </div>
            </article>
            <article class="card">
                <img src="https://image.tmdb.org/t/p/w200/xLxgVxFWvb9hhUyCDDXxRPPnFck.jpg" 
                    alt="Poster de Joker">
                    <h2>Joker</h2>
                    <p>2019 | Suspense Psicológico</p>
                    <p>Nota: ★★★★★</p>
                    <span>Assistido </span>
                    <div class="acoes">
                        <button>Editar</button><button>Remover</button>
                    </div>
            </article>
        </section>
    </main>

    <footer>
        <small>CineTrack - UEM | Direitos &copy; 2026</small>
    </footer>
</body>
</html>
